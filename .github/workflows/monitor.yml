name: qnyz-monitor

on:
  # 每 5 分钟定时检查，并保留手动触发入口。
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一组失败不影响另一组
      matrix:
        include:
          - name: A            # 9/13 → 9/14
            config: config.ci.a.yaml
          - name: B            # 9/14 → 9/15
            config: config.ci.b.yaml
          - name: C            # 9/15 → 9/16
            config: config.ci.c.yaml
          - name: D            # 9/16 → 9/17
            config: config.ci.d.yaml
          - name: E            # 9/17 → 9/18
            config: config.ci.e.yaml
          - name: F            # 9/18 → 9/19
            config: config.ci.f.yaml
          - name: G            # 9/19 → 9/20
            config: config.ci.g.yaml
    name: check-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      # 每组独立的去重缓存（key 前缀含组名，互不覆盖）
      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.name }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --once --config ${{ matrix.config }}
