name: qnyz-monitor

on:
  # 每 5 分钟定时检查，并保留手动触发入口。
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一组失败不影响另一组
      matrix:
        include:
          - name: A            # 当前唯一监控组，条件见 config.ci.a.yaml
            config: config.ci.a.yaml
    name: check-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      # 每组独立的去重缓存（key 前缀含组名，互不覆盖）
      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.name }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --once --config ${{ matrix.config }}
