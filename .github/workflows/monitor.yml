name: qnyz-monitor

on:
  # 每 5 分钟定时检查，并保留手动触发入口。
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OCT10
            label: 10月10日-11日单晚
            config: config.ci.oct10.yaml
    name: check-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.label }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --once --config ${{ matrix.config }}
